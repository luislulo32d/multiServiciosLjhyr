services:
  web:
    build: .
    container_name: ljhyr_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ljhyr
      DB_USER: ljhyr
      DB_PASS: ljhyr123
      APP_URL: http://localhost:8080
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: ljhyr_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ljhyr
      MYSQL_USER: ljhyr
      MYSQL_PASSWORD: ljhyr123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ljhyr_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
